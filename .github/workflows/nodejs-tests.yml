name: Node.js Tests

on:
  workflow_call:
    inputs:
      suite: { type: string, required: false, default: all }

jobs:
  nodejs-test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/nodejs
      TEST_SUITE: ${{ inputs.suite }}
    defaults:
      run:
        working-directory: src/templates/nodejs
    strategy:
      matrix:
        node-version: ['22.23.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Node.js template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh nodejs
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Enable pinned pnpm
        run: corepack enable
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
