name: Node.js Tests

on:
  workflow_call:
    inputs:
      suite: { type: string, required: false, default: all }

jobs:
  nodejs-test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/nodejs
      TEST_SUITE: ${{ inputs.suite }}
    defaults:
      run:
        working-directory: src/templates/nodejs
    strategy:
      matrix:
        node-version: ['22.23.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch Node.js template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh nodejs
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Enable pinned pnpm
        run: corepack enable
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
