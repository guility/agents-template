name: Run summary

on:
  workflow_call:
    inputs:
      branch_result: { type: string, required: true }
      fast_result: { type: string, required: true }
      quality_result: { type: string, required: true }
      image_result: { type: string, required: true }
      language_result: { type: string, required: true }
      mutation_result: { type: string, required: true }
      push_result: { type: string, required: true }
      publish_result: { type: string, required: true }

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - name: Install pinned uv
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Install locked report dependencies
        run: uv sync --project scripts/ci/quality-tools --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.quality_result != 'skipped'
        continue-on-error: true
        with:
          name: quality-metrics
          path: docs/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.quality_result != 'skipped'
        continue-on-error: true
        with:
          name: full-secret-status
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.quality_result != 'skipped'
        continue-on-error: true
        with:
          name: sast-status
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.fast_result != 'skipped'
        continue-on-error: true
        with:
          name: fast-quality-statuses
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.quality_result != 'skipped'
        continue-on-error: true
        with:
          name: slow-lint-statuses
          path: artifacts/reports/quality/lint/slow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.image_result == 'success'
        continue-on-error: true
        with:
          name: dependency-metrics
          path: artifacts/reports/dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.image_result == 'success'
        continue-on-error: true
        with:
          name: image-coverage
          path: artifacts/reports/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mutation_result == 'success'
        continue-on-error: true
        with:
          name: mutator-results
          path: artifacts/reports/mutation
      - name: Render the gate table and metrics matrix
        env:
          BRANCH_RESULT: ${{ inputs.branch_result }}
          FAST_RESULT: ${{ inputs.fast_result }}
          QUALITY_RESULT: ${{ inputs.quality_result }}
          IMAGE_RESULT: ${{ inputs.image_result }}
          LANGUAGE_RESULT: ${{ inputs.language_result }}
          MUTATION_RESULT: ${{ inputs.mutation_result }}
          PUSH_RESULT: ${{ inputs.push_result }}
          PUBLISH_RESULT: ${{ inputs.publish_result }}
        run: bash scripts/ci/quality-tools/render-run-summary.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pipeline-quality-reports
          path: docs/quality
          if-no-files-found: warn
