name: Image and unit gates

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production, then tests targets
        run: bash scripts/ci/images/build-targets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-images
          path: artifacts/images
          if-no-files-found: error

  image-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-images
          path: artifacts/images
      - name: Install pinned Trivy
        env:
          TRIVY_INSTALL_DIR: ${{ runner.temp }}/trivy-bin
        run: |
          bash scripts/ci/checks/install-trivy.sh
          echo "$TRIVY_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Scan built images and locked dependencies
        run: |
          set +e
          bash scripts/ci/images/scan-images.sh
          image_result=$?
          bash scripts/ci/images/scan-dependencies.sh
          dependency_result=$?
          exit $((image_result || dependency_result))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-metrics
          path: artifacts/reports/dependencies
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-reports
          path: artifacts/reports/images
          if-no-files-found: warn

  unit:
    needs: image-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - name: Install pinned uv
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-images
          path: artifacts/images
      - name: Run unit suite from built tests image ID
        run: bash scripts/ci/images/run-unit-from-image.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-coverage
          path: artifacts/reports/coverage-image
          if-no-files-found: error
