name: Source quality gates

on:
  workflow_call:

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep SAST
        run: |
          bash scripts/setup/fetch_language_templates.sh all
          docker run --rm -v "$PWD:/src" --entrypoint semgrep semgrep/semgrep:1.99.0 scan --config p/default --error --metrics off /src

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.5/codeql-bundle-linux64.tar.gz
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'never' || 'always' }}

  quality-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - name: Install pinned uv
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Install tools, templates and scan secrets
        env:
          GITLEAKS_INSTALL_DIR: ${{ runner.temp }}/quality-bin
        run: |
          uv sync --project scripts/ci/quality-tools --locked --no-dev
          bash scripts/setup/fetch_language_templates.sh all
          bash scripts/ci/checks/install-gitleaks.sh
          "$GITLEAKS_INSTALL_DIR/gitleaks" dir --redact --no-banner src/templates
      - name: Measure complexity and run Dryer
        run: |
          uv run --project scripts/ci/quality-tools --no-sync python scripts/testing/quality_metrics.py --component common scripts
          for language in python nodejs rust go csharp; do
            uv run --project scripts/ci/quality-tools --no-sync python scripts/testing/quality_metrics.py --component "$language" "src/templates/$language/src"
          done
          bash scripts/ci/quality-tools/run-dryer.sh src/templates/python src/templates/nodejs src/templates/rust src/templates/go
          python scripts/ci/quality-tools/metrics/render_quality_matrix.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-metrics
          path: docs/quality
          if-no-files-found: error

  slow-language-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
      - name: Install Rust and language templates
        run: |
          bash scripts/setup/fetch_language_templates.sh all
      - name: Check Python, Node.js and C#
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: bash scripts/ci/checks/slow-language-checks.sh
