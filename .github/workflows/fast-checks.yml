name: Fast push checks

on:
  workflow_call:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fast-bin
          key: fast-gitleaks-${{ runner.os }}-8.30.1
      - id: changed
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$(bash scripts/common/git/resolve-diff-base.sh "$HEAD_SHA" "$BASE_SHA")"
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          grep -Eq '\.py$|(^|/)(pyproject\.toml|uv\.lock|ruff\.toml|\.ruff\.toml)$' <<< "$changed" && echo 'python=true' >> "$GITHUB_OUTPUT" || echo 'python=false' >> "$GITHUB_OUTPUT"
          grep -Eq '\.(js|jsx|ts|tsx)$|(^|/)(package\.json|package-lock\.json|pnpm-lock\.yaml|\.prettierrc([^/]*)|prettier\.config\.[^/]+|\.editorconfig|\.prettierignore)$' <<< "$changed" && echo 'node=true' >> "$GITHUB_OUTPUT" || echo 'node=false' >> "$GITHUB_OUTPUT"
          grep -Eq '\.go$|(^|/)(go\.(mod|sum)|go\.work(\.sum)?|\.golangci\.(yml|yaml|toml))$' <<< "$changed" && echo 'go=true' >> "$GITHUB_OUTPUT" || echo 'go=false' >> "$GITHUB_OUTPUT"
          grep -Eq '\.rs$|(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?|rustfmt\.toml|\.rustfmt\.toml|clippy\.toml|\.clippy\.toml|\.cargo/config(\.toml)?)$' <<< "$changed" && echo 'rust=true' >> "$GITHUB_OUTPUT" || echo 'rust=false' >> "$GITHUB_OUTPUT"
      - name: Initialize changed-language lint results
        env:
          PYTHON_CHANGED: ${{ steps.changed.outputs.python }}
          NODE_CHANGED: ${{ steps.changed.outputs.node }}
          GO_CHANGED: ${{ steps.changed.outputs.go }}
          RUST_CHANGED: ${{ steps.changed.outputs.rust }}
          QUALITY_STATUS_ROOT: artifacts/reports/quality
        run: |
          mkdir -p "$QUALITY_STATUS_ROOT/lint/fast"
          for language in python node go rust; do
            variable="$(printf '%s_CHANGED' "$language" | tr '[:lower:]' '[:upper:]')"
            if [[ "${!variable}" == true ]]; then
              component="$language"
              [[ "$component" != node ]] || component=nodejs
              printf 'failed\n' > "$QUALITY_STATUS_ROOT/lint/fast/$component.status"
            fi
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.node == 'true'
        with:
          node-version: '22.23.5'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.node == 'true'
        with:
          path: ~/.npm
          key: fast-npm-${{ runner.os }}-node22.23.5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.changed.outputs.go == 'true'
        with:
          go-version: '1.24.2'
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.go == 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/bin/golangci-lint
          key: fast-go-${{ runner.os }}-1.24.2-${{ hashFiles('**/go.sum', '**/go.work.sum', '**/go.work') }}-2.8.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            ${{ runner.temp }}/cargo-target
          key: fast-rust-${{ runner.os }}-1.100.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Install measured fast checks
        env:
          GITLEAKS_INSTALL_DIR: ${{ runner.temp }}/fast-bin
          GITHUB_EVENT_BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/ci/checks/install-gitleaks.sh
          echo "$GITLEAKS_INSTALL_DIR" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/ci/checks/install-fast-check-tools.sh "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
      - name: Run outgoing-diff checks
        env:
          QUALITY_STATUS_ROOT: artifacts/reports/quality
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          GITHUB_EVENT_BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/checks/fast-push-checks.sh
      - name: Upload fast check result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-quality-statuses
          path: artifacts/reports/quality
          if-no-files-found: ignore
