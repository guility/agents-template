name: Publish successful main metrics

on:
  workflow_call:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - name: Install pinned uv
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Install locked report dependencies
        run: uv sync --project scripts/ci/quality-tools --locked --no-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-metrics
          path: docs/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: fast-quality-statuses
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: full-secret-status
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sast-status
          path: artifacts/reports/quality
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: slow-lint-statuses
          path: artifacts/reports/quality/lint/slow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-metrics
          path: artifacts/reports/dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutator-results
          path: artifacts/reports/mutation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-coverage
          path: artifacts/reports/coverage
      - name: Merge successful pipeline measurements
        run: |
          sast_result=n/a
          [[ ! -f artifacts/reports/quality/sast.status ]] || sast_result="$(cat artifacts/reports/quality/sast.status)"
          uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/merge_pipeline_metrics.py --sast-result "$sast_result" --secret-status-root artifacts/reports/quality --lint-status-root artifacts/reports/quality/lint --require-slow-lint --coverage-root artifacts/reports/coverage
          uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/metrics/render_quality_matrix.py
          uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/metrics/write_badge_endpoints.py
      - name: Publish metrics to the protected-main badge branch
        env:
          QUALITY_METRICS_GIT_NAME: github-actions[bot]
          QUALITY_METRICS_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/quality-tools/publish-metrics-branch.sh
