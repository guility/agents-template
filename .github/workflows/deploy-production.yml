name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Quality pipeline run ID on protected main
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate successful protected-main pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: bash scripts/ci/deploy/validate-source-run.sh "$RUN_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-image-refs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Authenticate to GHCR for digest pulls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Deploy immutable registry images
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
        run: sh scripts/ci/deploy/deploy-images.sh
