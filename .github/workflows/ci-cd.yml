name: Quality pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate branch before other checks
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/common/validate-branch.sh "$BRANCH_NAME"

  fast-checks:
    needs: branch-gate
    uses: ./.github/workflows/fast-checks.yml

  prebuild-gates:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: fast-checks
    uses: ./.github/workflows/prebuild-gates.yml

  image-gate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: prebuild-gates
    uses: ./.github/workflows/image-gate.yml

  language-suites:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: image-gate
    uses: ./.github/workflows/language-tests.yml
    with:
      suite: post-merge
      run_python: true
      run_nodejs: true
      run_rust: true
      run_go: true
      run_csharp: true

  mutator:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: [language-suites, prebuild-gates]
    uses: ./.github/workflows/mutation-tests.yml

  push-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: [image-gate, language-suites, mutator]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/push-images.yml

  summary:
    if: always()
    needs:
      - branch-gate
      - fast-checks
      - prebuild-gates
      - image-gate
      - language-suites
      - mutator
      - push-images
      - publish-quality-metrics
    uses: ./.github/workflows/run-summary.yml
    with:
      branch_result: ${{ needs.branch-gate.result }}
      fast_result: ${{ needs.fast-checks.result }}
      quality_result: ${{ needs.prebuild-gates.result }}
      image_result: ${{ needs.image-gate.result }}
      language_result: ${{ needs.language-suites.result }}
      mutation_result: ${{ needs.mutator.result }}
      push_result: ${{ needs.push-images.result }}
      publish_result: ${{ needs.publish-quality-metrics.result }}

  publish-quality-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [branch-gate, fast-checks, prebuild-gates, image-gate, language-suites, mutator, push-images]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-quality-metrics.yml
