name: Quality pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate branch before other checks
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/common/validate-branch.sh "$BRANCH_NAME"

  run-fast-checks:
    needs: branch-gate
    uses: ./.github/workflows/fast-checks.yml

  run-prebuild-gates:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: run-fast-checks
    uses: ./.github/workflows/prebuild-gates.yml

  run-image-gate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: run-prebuild-gates
    uses: ./.github/workflows/image-gate.yml

  required-gate-checks:
    if: always()
    needs: [branch-gate, run-fast-checks, run-prebuild-gates, run-image-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: fast-checks
            result: ${{ needs.run-fast-checks.result }}
            required: true
          - gate: prebuild-gates
            result: ${{ needs.run-prebuild-gates.result }}
            required: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
          - gate: image-gate
            result: ${{ needs.run-image-gate.result }}
            required: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    name: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GATE_NAME: ${{ matrix.gate }}
          GATE_RESULT: ${{ matrix.result }}
          GATE_REQUIRED: ${{ matrix.required }}
        run: bash scripts/ci/checks/status/assert-gate-result.sh "$GATE_NAME" "$GATE_RESULT" "$GATE_REQUIRED"

  language-suites:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: [run-image-gate, required-gate-checks]
    uses: ./.github/workflows/language-tests.yml
    with:
      suite: post-merge
      run_python: true
      run_nodejs: true
      run_rust: true
      run_go: true
      run_csharp: true

  mutator:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: [language-suites, run-prebuild-gates]
    uses: ./.github/workflows/mutation-tests.yml

  push-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.ref_protected
    needs: [run-image-gate, required-gate-checks, language-suites, mutator]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/push-images.yml

  summary:
    if: always()
    needs:
      - branch-gate
      - run-fast-checks
      - run-prebuild-gates
      - run-image-gate
      - required-gate-checks
      - language-suites
      - mutator
      - push-images
      - publish-quality-metrics
    uses: ./.github/workflows/run-summary.yml
    with:
      branch_result: ${{ needs.branch-gate.result }}
      fast_result: ${{ needs.run-fast-checks.result }}
      quality_result: ${{ needs.run-prebuild-gates.result }}
      image_result: ${{ needs.run-image-gate.result }}
      language_result: ${{ needs.language-suites.result }}
      mutation_result: ${{ needs.mutator.result }}
      push_result: ${{ needs.push-images.result }}
      publish_result: ${{ needs.publish-quality-metrics.result }}

  publish-quality-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [branch-gate, run-fast-checks, run-prebuild-gates, run-image-gate, required-gate-checks, language-suites, mutator, push-images]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-quality-metrics.yml
