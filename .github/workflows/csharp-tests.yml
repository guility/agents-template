name: C# Tests

on:
  workflow_call:

jobs:
  csharp-test:
    name: C# Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/csharp
    defaults:
      run:
        working-directory: src/templates/csharp
    steps:
      - uses: actions/checkout@v4

      - name: Fetch C# template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh csharp
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Restore pinned Stryker.NET tool
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      
      - name: Build
        run: dotnet build --no-restore
      
      - name: Run unit and native mutation suites
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-csharp
          path: test-results/csharp/**/coverage.cobertura.xml
          if-no-files-found: warn

