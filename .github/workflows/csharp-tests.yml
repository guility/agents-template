name: C# Tests

on:
  workflow_call:

jobs:
  csharp-test:
    name: C# Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/csharp
    defaults:
      run:
        working-directory: src/templates/csharp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch C# template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh csharp
      
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.404'
      
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Restore pinned Stryker.NET tool
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      
      - name: Build
        run: dotnet build --no-restore
      
      - name: Run unit and native mutation suites
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-csharp
          path: test-results/csharp/**/coverage.cobertura.xml
          if-no-files-found: warn

