name: C# Tests

on:
  workflow_call:
    inputs:
      suite: { type: string, required: false, default: all }

jobs:
  csharp-test:
    name: C# Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/csharp
      TEST_SUITE: ${{ inputs.suite }}
    defaults:
      run:
        working-directory: src/templates/csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch C# template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh csharp
      
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
      
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Restore pinned Stryker.NET tool
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      
      - name: Build
        run: dotnet build --no-restore
      
      - name: Run requested test suites
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
