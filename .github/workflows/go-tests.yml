name: Go Tests

on:
  workflow_call:

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/go
    defaults:
      run:
        working-directory: src/templates/go
    strategy:
      matrix:
        go-version: ['1.24.2']
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Go template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh go
      
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install pinned Gremlins mutation runner
        working-directory: .
        env:
          GREMLINS_INSTALL_DIR: ${{ runner.temp }}/go-bin
        run: |
          bash scripts/ci/checks/install-gremlins.sh
          echo "$GREMLINS_INSTALL_DIR" >> "$GITHUB_PATH"
      
      - name: Run tests
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: test-results/go-coverage.out
          if-no-files-found: warn

