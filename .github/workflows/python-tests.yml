name: Python Tests

on:
  workflow_call:

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-26.04
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/python
    defaults:
      run:
        working-directory: src/templates/python
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Python template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh python
      
      - name: Install pinned uv
        working-directory: .
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      
      - name: Set up pinned Python 3.14.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      
      - name: Install dependencies
        run: uv sync --locked --all-extras
      
      - name: Run tests
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: test-results/coverage.xml
          if-no-files-found: warn
