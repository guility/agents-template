name: Python Tests

on:
  workflow_call:
    inputs:
      suite: { type: string, required: false, default: all }

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-26.04
    env:
      PROJECT_ROOT: ${{ github.workspace }}/src/templates/python
      TEST_SUITE: ${{ inputs.suite }}
    defaults:
      run:
        working-directory: src/templates/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Python template
        working-directory: .
        run: bash scripts/setup/fetch_language_templates.sh python
      
      - name: Install pinned uv
        working-directory: .
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-bin
          UV_VERSION: 0.13.9
        run: |
          bash scripts/ci/checks/install-uv.sh
          echo "$UV_INSTALL_DIR" >> "$GITHUB_PATH"
      
      - name: Set up pinned Python 3.14.8
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      
      - name: Install dependencies
        run: uv sync --locked --all-extras
      
      - name: Run tests
        run: bash "$GITHUB_WORKSPACE/scripts/common/run-tests.sh"
