branch-name-validation:
  stage: .pre
  image: alpine:3.21.3
  script:
    - branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
    - |
      case "$branch" in
        main|dev|test|research/*|feature/*|fix/*) ;;
        python|nodejs|rust|go|csharp)
          [ "$CI_PROJECT_NAME" = agents-template-langs ] || exit 2 ;;
        *) echo "Invalid branch name: $branch" >&2; exit 2 ;;
      esac
    - apk add --no-cache bash git
    - bash scripts/common/validate-branch.sh "$branch"
  after_script:
    - mkdir -p artifacts/reports/quality
    - if [ "$CI_JOB_STATUS" = success ]; then printf 'passed\n' > artifacts/reports/quality/branch.status; else printf 'failed\n' > artifacts/reports/quality/branch.status; fi
  artifacts:
    when: always
    paths: [artifacts/reports/quality/branch.status]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

fast-universal-checks:
  stage: .pre
  needs: [branch-name-validation]
  image: python:3.14.8-slim
  variables:
    GITLEAKS_INSTALL_DIR: "$CI_PROJECT_DIR/.tools/bin"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    QUALITY_STATUS_ROOT: "$CI_PROJECT_DIR/artifacts/reports/quality"
  cache:
    key: fast-universal-${CI_COMMIT_REF_SLUG}-gitleaks8.30.1
    paths: [.tools/bin/, .cache/pip/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl git
    - python -m pip install lizard==1.25.0
    - mkdir -p "$GITLEAKS_INSTALL_DIR" && bash scripts/ci/checks/install-gitleaks.sh
    - export PATH="$GITLEAKS_INSTALL_DIR:$PATH"
  script:
    - bash scripts/ci/checks/fast-push-checks.sh "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}" "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" "$CI_COMMIT_SHA" universal
  after_script:
    - mkdir -p artifacts/reports/quality
    - if [ "$CI_JOB_STATUS" = success ]; then printf 'passed\n' > artifacts/reports/quality/fast.status; else printf 'failed\n' > artifacts/reports/quality/fast.status; fi
  artifacts:
    when: always
    paths:
      - artifacts/reports/quality/fast.status
      - artifacts/reports/quality/secrets/fast.status
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
