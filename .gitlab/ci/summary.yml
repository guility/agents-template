.quality-tools-runtime:
  image: python:3.14.8-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl git
    - UV_INSTALL_DIR=/usr/local/bin UV_VERSION="$UV_VERSION" bash scripts/ci/checks/install-uv.sh
    - uv sync --project scripts/ci/quality-tools --locked --no-dev

quality-summary:
  extends: .quality-tools-runtime
  stage: .post
  when: always
  script: [bash scripts/ci/quality-tools/render-gitlab-summary.sh]
  artifacts:
    when: always
    paths: [docs/quality/quality-metrics.json, docs/quality/quality-matrix.md, docs/quality/reports/]
    expire_in: 30 days

publish-quality-metrics:
  extends: .quality-tools-runtime
  stage: publish_metrics
  script:
    - uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/merge_pipeline_metrics.py --sast-result success --fast-result success --lint-result success --secrets-result success --coverage-root artifacts/reports/coverage-image
    - uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/metrics/render_quality_matrix.py
    - uv run --project scripts/ci/quality-tools --no-sync python scripts/ci/quality-tools/metrics/write_badge_endpoints.py
    - bash scripts/ci/quality-tools/publish-metrics-branch.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
