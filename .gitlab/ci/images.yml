build-images:
  stage: build
  image:
    name: quay.io/buildah/stable:v1.41.4
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  script:
    - bash scripts/ci/images/buildah/build-targets-buildah.sh
  artifacts:
    paths: [artifacts/images/]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

scan-images:
  stage: security
  needs:
    - job: build-images
      artifacts: true
  image: python:3.14.8-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl git
    - TRIVY_INSTALL_DIR=/usr/local/bin TRIVY_VERSION="$TRIVY_VERSION" bash scripts/ci/checks/install-trivy.sh
  script:
    - sh scripts/ci/images/scan-images.sh
    - bash scripts/ci/images/scan-dependencies.sh
  artifacts:
    when: always
    paths: [artifacts/reports/dependencies/]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

push-images:
  stage: push
  needs:
    - job: build-images
      artifacts: true
    - job: scan-images
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: post-merge-python-tests
      optional: true
      artifacts: false
    - job: post-merge-nodejs-tests
      optional: true
      artifacts: false
    - job: post-merge-rust-tests
      optional: true
      artifacts: false
    - job: post-merge-go-tests
      optional: true
      artifacts: false
    - job: post-merge-csharp-tests
      optional: true
      artifacts: false
    - job: mutator-python
      optional: true
      artifacts: false
    - job: mutator-nodejs
      optional: true
      artifacts: false
    - job: mutator-rust
      optional: true
      artifacts: false
    - job: mutator-go
      optional: true
      artifacts: false
  image:
    name: quay.io/buildah/stable:v1.41.4
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  script:
    - bash scripts/ci/images/push-images.sh
  artifacts:
    paths: [artifacts/registry-image-refs.txt]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
