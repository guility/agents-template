build-images:
  stage: build
  image:
    name: quay.io/buildah/stable:v1.41.4
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  script:
    - bash scripts/ci/images/buildah/build-targets-buildah.sh
  artifacts:
    paths: [artifacts/images/]
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

scan-images:
  stage: security
  needs:
    - job: build-images
      artifacts: true
  image: python:3.14.8-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl git
    - TRIVY_INSTALL_DIR=/usr/local/bin TRIVY_VERSION="$TRIVY_VERSION" bash scripts/ci/checks/install-trivy.sh
  script:
    - |
      set +e
      sh scripts/ci/images/scan-images.sh
      image_result=$?
      bash scripts/ci/images/scan-dependencies.sh
      dependency_result=$?
      exit $((image_result || dependency_result))
  artifacts:
    when: always
    paths:
      - artifacts/reports/dependencies/
      - artifacts/reports/images/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

push-images:
  stage: push
  needs:
    - job: branch-name-validation
      artifacts: false
    - job: fast-universal-checks
      artifacts: false
    - job: fast-python-checks
      optional: true
      artifacts: false
    - job: fast-node-checks
      optional: true
      artifacts: false
    - job: fast-rust-checks
      optional: true
      artifacts: false
    - job: fast-go-checks
      optional: true
      artifacts: false
    - job: semgrep-sast
      artifacts: false
    - job: quality-metrics
      artifacts: false
    - job: python-typecheck
      artifacts: false
    - job: node-typecheck
      artifacts: false
    - job: csharp-format
      artifacts: false
    - job: build-images
      artifacts: true
    - job: scan-images
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: post-merge-python-tests
      artifacts: false
    - job: post-merge-nodejs-tests
      artifacts: false
    - job: post-merge-rust-tests
      artifacts: false
    - job: post-merge-go-tests
      artifacts: false
    - job: post-merge-csharp-tests
      artifacts: false
    - job: mutator-python
      artifacts: false
    - job: mutator-nodejs
      artifacts: false
    - job: mutator-rust
      artifacts: false
    - job: mutator-go
      artifacts: false
  image:
    name: quay.io/buildah/stable:v1.41.4
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  script:
    - bash scripts/ci/images/push-images.sh
  artifacts:
    paths: [artifacts/registry-image-refs.txt]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
