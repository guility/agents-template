deploy-production:
  stage: deploy
  image: alpine:3.21.3
  needs:
    - job: push-images
      artifacts: true
    - job: quality-summary
      artifacts: false
  environment:
    name: production
  when: manual
  allow_failure: false
  script:
    - sh scripts/ci/deploy/deploy-images.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      exists:
        - deploy/Dockerfiles/Dockerfile*
        - deploy/Dockerfiles/*.dockerfile
    - when: never
