fast-rust-checks:
  stage: .pre
  needs: [branch-name-validation]
  image: rust:1.100.0-slim
  variables:
    GIT_DEPTH: "0"
    QUALITY_STATUS_ROOT: "$CI_PROJECT_DIR/artifacts/reports/quality"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/.cargo-target"
  cache:
    key: fast-rust-${CI_COMMIT_REF_SLUG}-1.100.0
    paths: [.cargo/registry/, .cargo/git/db/, .cargo-target/]
  before_script:
    - mkdir -p "$QUALITY_STATUS_ROOT/lint/fast" && printf 'failed\n' > "$QUALITY_STATUS_ROOT/lint/fast/rust.status"
    - apt-get update && apt-get install -y --no-install-recommends bash git pkg-config libssl-dev
    - rustup component add clippy rustfmt --toolchain 1.100.0
  script:
    - RUSTUP_TOOLCHAIN=1.100.0 bash scripts/ci/checks/fast-push-checks.sh "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}" "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" "$CI_COMMIT_SHA" rust
  artifacts:
    when: always
    paths: [artifacts/reports/quality/lint/fast/rust.status]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', '**/rust-toolchain', '**/rust-toolchain.toml', '**/rustfmt.toml', '**/.rustfmt.toml', '**/clippy.toml', '**/.clippy.toml', '**/.cargo/config', '**/.cargo/config.toml']
