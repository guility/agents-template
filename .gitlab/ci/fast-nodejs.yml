fast-node-checks:
  stage: .pre
  needs: [branch-name-validation]
  image: node:22.23.5-bookworm-slim
  variables: { GIT_DEPTH: "0", NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm", QUALITY_STATUS_ROOT: "$CI_PROJECT_DIR/artifacts/reports/quality" }
  cache:
    key: fast-npm-${CI_COMMIT_REF_SLUG}-node22.23.5
    paths: [.npm/]
  before_script:
    - mkdir -p "$QUALITY_STATUS_ROOT/lint/fast" && printf 'failed\n' > "$QUALITY_STATUS_ROOT/lint/fast/nodejs.status"
    - apt-get update && apt-get install -y --no-install-recommends bash git
    - npm install --global prettier@3.6.2
  script:
    - bash scripts/ci/checks/fast-push-checks.sh "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}" "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" "$CI_COMMIT_SHA" nodejs
  artifacts:
    when: always
    paths: [artifacts/reports/quality/lint/fast/nodejs.status]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ['**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/package.json', '**/package-lock.json', '**/pnpm-lock.yaml', '**/.prettierrc*', '**/prettier.config.*', '**/.editorconfig', '**/.prettierignore']
