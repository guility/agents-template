fast-node-checks:
  stage: .pre
  needs: [branch-name-validation]
  image: node:22.17.1-bookworm-slim
  variables: { GIT_DEPTH: "0", NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm" }
  cache:
    key: fast-npm-${CI_COMMIT_REF_SLUG}-node22.17.1
    paths: [.npm/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash git
    - npm install --global prettier@3.6.2
  script:
    - bash scripts/ci/checks/fast-push-checks.sh "$CI_COMMIT_REF_NAME" "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" "$CI_COMMIT_SHA" nodejs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ['**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/package.json', '**/pnpm-lock.yaml']
