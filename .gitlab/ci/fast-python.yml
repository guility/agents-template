fast-python-checks:
  stage: .pre
  needs: [branch-name-validation]
  image: python:3.14.8-slim
  variables: { GIT_DEPTH: "0", PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip" }
  cache:
    key: fast-pip-${CI_COMMIT_REF_SLUG}-${CI_PROJECT_NAME}
    paths: [.cache/pip/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash git
    - python -m pip install ruff==0.17.6
  script:
    - bash scripts/ci/checks/fast-push-checks.sh "$CI_COMMIT_REF_NAME" "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" "$CI_COMMIT_SHA" python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ['**/*.py', '**/pyproject.toml', '**/uv.lock']
